<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apartment · Need vs Nice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=8" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path
                d="M3 15.5V7.2L9 2.5l6 4.7v8.3H3Z"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
              <path d="M7 15.5v-5h4v5" stroke="currentColor" stroke-width="1.5" />
            </svg>
          </span>
          <div>
            <p class="eyebrow">Workspace</p>
            <h1>Apartment</h1>
          </div>
        </div>

        <div class="topbar-actions">
          <label class="search">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <circle cx="6" cy="6" r="4.25" stroke="currentColor" stroke-width="1.4" />
              <path d="M9.2 9.2 12 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
            <input id="search" type="search" placeholder="Filter notes" />
          </label>
          <button class="btn primary" id="new-note" type="button">
            <span aria-hidden="true">+</span> New note
          </button>
        </div>
      </header>

      <p class="save-banner" id="save-status"></p>

      <main class="board" id="board">
        <section class="column" data-column="nice" aria-labelledby="nice-title">
          <header class="column-header">
            <div class="column-title">
              <span class="dot nice"></span>
              <h2 id="nice-title">Nice to have</h2>
              <span class="count" data-count="nice">0</span>
            </div>
            <p class="column-copy">Upgrades if budget and space allow.</p>
          </header>
          <div class="card-list" data-list="nice"></div>
          <button class="add-in-column" type="button" data-add="nice">+ Add note</button>
        </section>

        <section class="column" data-column="need" aria-labelledby="need-title">
          <header class="column-header">
            <div class="column-title">
              <span class="dot need"></span>
              <h2 id="need-title">Need to have</h2>
              <span class="count" data-count="need">0</span>
            </div>
            <p class="column-copy">Essentials you should not skip.</p>
          </header>
          <div class="card-list" data-list="need"></div>
          <button class="add-in-column" type="button" data-add="need">+ Add note</button>
        </section>
      </main>
    </div>

    <dialog class="modal" id="note-modal">
      <form method="dialog" id="note-form">
        <h3 id="modal-title">New note</h3>
        <label>
          Title
          <input id="note-title" name="title" required maxlength="120" placeholder="e.g. Blackout curtains" />
        </label>
        <label>
          Details
          <textarea
            id="note-body"
            name="body"
            rows="4"
            maxlength="600"
            placeholder="Optional context, size, store, or why it matters"
          ></textarea>
        </label>
        <fieldset class="importance-picker">
          <legend>Column</legend>
          <div class="importance-options author-options">
            <label><input type="radio" name="column" value="nice" /> Nice to have</label>
            <label><input type="radio" name="column" value="need" checked /> Need to have</label>
          </div>
        </fieldset>
        <fieldset class="importance-picker">
          <legend>Who made this</legend>
          <div class="importance-options author-options">
            <label><input type="radio" name="author" value="Arthur" checked /> Arthur</label>
            <label><input type="radio" name="author" value="Alice" /> Alice</label>
          </div>
        </fieldset>
        <fieldset class="importance-picker">
          <legend>Importance</legend>
          <p class="importance-hint">1 is not so important, 5 is most important</p>
          <div class="importance-options">
            <label><input type="radio" name="importance" id="importance-1" value="1" /> 1</label>
            <label><input type="radio" name="importance" id="importance-2" value="2" /> 2</label>
            <label><input type="radio" name="importance" id="importance-3" value="3" checked /> 3</label>
            <label><input type="radio" name="importance" id="importance-4" value="4" /> 4</label>
            <label><input type="radio" name="importance" id="importance-5" value="5" /> 5</label>
          </div>
        </fieldset>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="cancel-note">Cancel</button>
          <button type="submit" class="btn primary" id="save-note">Save note</button>
        </div>
      </form>
    </dialog>

    <script src="app.js?v=8"></script>
  </body>
</html>
